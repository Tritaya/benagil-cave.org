[build]
  # Publish ONLY public files: make_public.sh copies the pages, CSS/JS, images, sitemap, robots and the
  # IndexNow key into _public/. Scripts, offers data and image plans are never served.
  # Edge functions keep running from netlify/edge-functions/.
  command = "sh make_public.sh"
  publish = "_public"

[[redirects]]
  from = "/benagil-boat-tour.html"
  to = "/benagil-boat-tour"
  status = 301
  force = true

